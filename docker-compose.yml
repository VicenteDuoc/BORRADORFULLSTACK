version: '3.8'
services:

  mysql-registro:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: registro_db
    ports:
      - "3306:3306"

  mysql-pedido:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pedido_db
    ports:
      - "3307:3306"

  mysql-carrito:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: carrito_db
    ports:
      - "3308:3306"

  mysql-autenticacion:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autenticacion_db
    ports:
      - "3309:3306"