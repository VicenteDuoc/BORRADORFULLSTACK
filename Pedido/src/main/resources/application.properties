spring.application.name=Pedido
spring.datasource.url=jdbc:mysql://localhost:3307/pedido_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.url=jdbc:mysql://localhost:3307/pedido_db?createDatabaseIfNotExist=true
spring.flyway.user=root
spring.flyway.password=root

server.port=8082